<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dukaan — Apni Marketplace</title>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #faf8f5;
    --accent: #2f5d50;
    --accent-light: #e8f0ec;
    --line: #e2ddd4;
    --muted: #7a7468;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    background: var(--ink);
    color: var(--paper);
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  #cart-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  main { max-width: 1000px; margin: 0 auto; padding: 32px 24px; }
  #status-bar {
    background: var(--accent-light);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 24px;
    font-size: 14px;
    color: var(--accent);
    display: none;
  }
  #status-bar.show { display: block; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }
  .card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card-img {
    width: 100%;
    height: 140px;
    background: var(--accent-light);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
  }
  .card h3 { font-size: 16px; font-weight: 600; }
  .card .price { font-size: 18px; font-weight: 700; color: var(--accent); }
  .card .stock { font-size: 12px; color: var(--muted); }
  .card button {
    margin-top: 6px;
    background: var(--ink);
    color: white;
    border: none;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
  }
  .card button:disabled { background: #ccc; cursor: not-allowed; }
  #empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  #cart-panel {
    position: fixed;
    top: 0; right: -380px;
    width: 360px; height: 100%;
    background: white;
    box-shadow: -4px 0 20px rgba(0,0,0,0.1);
    transition: right 0.25s ease;
    padding: 24px;
    overflow-y: auto;
    z-index: 20;
  }
  #cart-panel.open { right: 0; }
  #cart-panel h2 { margin-bottom: 16px; }
  .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  #cart-total {
    margin-top: 16px;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
  }
  #checkout-btn {
    width: 100%;
    margin-top: 16px;
    background: var(--accent);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
  }
  #close-cart { background: none; border: none; font-size: 18px; cursor: pointer; float: right; }
  #overlay {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.3);
    z-index: 15;
  }
  #overlay.show { display: block; }
</style>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

<header>
  <h1>Dukaan</h1>
  <div style="display:flex;gap:10px;align-items:center">
    <span id="user-name" style="font-size:13px;display:none"></span>
    <button id="login-nav-btn" onclick="toggleAuth()" style="background:none;border:1px solid var(--paper);color:var(--paper);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px">Login</button>
    <button id="cart-btn" onclick="toggleCart()">Cart (<span id="cart-count">0</span>)</button>
  </div>
</header>

<div id="auth-overlay" onclick="toggleAuth()" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);z-index:25"></div>
<div id="auth-panel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;border-radius:10px;padding:24px;width:320px;z-index:26;box-shadow:0 10px 40px rgba(0,0,0,0.2)">
  <h2 id="auth-title" style="margin-bottom:14px;font-size:18px">Login Karein</h2>
  <div id="auth-name-field" style="display:none">
    <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:4px">Naam</label>
    <input id="auth-name" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;margin-bottom:10px">
  </div>
  <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:4px">Email</label>
  <input id="auth-email" type="email" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;margin-bottom:10px">
  <div id="auth-phone-field" style="display:none">
    <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:4px">Phone</label>
    <input id="auth-phone" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;margin-bottom:10px">
  </div>
  <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:4px">Password</label>
  <input id="auth-password" type="password" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;margin-bottom:14px">
  <button onclick="submitAuth()" style="width:100%;background:var(--accent);color:white;border:none;padding:11px;border-radius:6px;font-weight:700;cursor:pointer">Submit</button>
  <div onclick="toggleAuthMode()" style="text-align:center;margin-top:12px;font-size:13px;color:var(--accent);cursor:pointer" id="auth-toggle-text">Naya account banayein</div>
</div>

<main>
  <div id="status-bar"></div>
  <div id="products" class="grid"></div>
  <div id="empty-state" style="display:none">
    Abhi koi product available nahi hai. Backend chal raha hai ki nahi check karein.
  </div>
</main>

<div id="overlay" onclick="toggleCart()"></div>
<div id="cart-panel">
  <button id="close-cart" onclick="toggleCart()">✕</button>
  <h2>Aapka Cart</h2>
  <div id="cart-items"></div>
  <div id="cart-total"><span>Total</span><span id="cart-total-amount">₹0</span></div>
  <label style="display:block;font-size:13px;font-weight:600;margin:14px 0 6px">Payment Method</label>
  <select id="payment-method" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;font-size:14px">
    <option value="cod">Cash on Delivery</option>
    <option value="prepaid">Online Payment (Card/UPI)</option>
  </select>
  <button id="checkout-btn" onclick="placeOrder()">Order Karein</button>
</div>

<script>
  // Backend yahan chal raha hoga — jab live server pe daalenge to ye URL badal dena
  const API_BASE = "https://kisswaar-x-store.onrender.com/api"

  let products = [];
  let cart = {}; // { productId: quantity }
  let isRegisterMode = false;

  function toggleAuth() {
    document.getElementById('auth-overlay').style.display = document.getElementById('auth-overlay').style.display === 'none' ? 'block' : 'none';
    document.getElementById('auth-panel').style.display = document.getElementById('auth-panel').style.display === 'none' ? 'block' : 'none';
  }

  function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    document.getElementById('auth-title').textContent = isRegisterMode ? 'Naya Account Banayein' : 'Login Karein';
    document.getElementById('auth-name-field').style.display = isRegisterMode ? 'block' : 'none';
    document.getElementById('auth-phone-field').style.display = isRegisterMode ? 'block' : 'none';
    document.getElementById('auth-toggle-text').textContent = isRegisterMode ? 'Pehle se account hai? Login karein' : 'Naya account banayein';
  }

  async function submitAuth() {
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;

    try {
      let res, data;
      if (isRegisterMode) {
        res = await fetch(`${API_BASE}/auth/customer/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('auth-name').value,
            email, password,
            phone: document.getElementById('auth-phone').value,
          }),
        });
      } else {
        res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
      }
      data = await res.json();
      if (!res.ok) throw new Error(data.message);

      localStorage.setItem('customerToken', data.token);
      localStorage.setItem('customerName', data.user.name);
      updateAuthUI();
      toggleAuth();
      showStatus(`Welcome, ${data.user.name}`);
    } catch (err) {
      showStatus(err.message, true);
    }
  }

  function updateAuthUI() {
    const name = localStorage.getItem('customerName');
    if (name) {
      document.getElementById('user-name').textContent = name;
      document.getElementById('user-name').style.display = 'inline';
      document.getElementById('login-nav-btn').textContent = 'Logout';
      document.getElementById('login-nav-btn').onclick = () => {
        localStorage.removeItem('customerToken');
        localStorage.removeItem('customerName');
        location.reload();
      };
    }
  }
  updateAuthUI();

  function showStatus(message, isError = false) {
    const bar = document.getElementById('status-bar');
    bar.textContent = message;
    bar.style.borderColor = isError ? '#c0392b' : 'var(--accent)';
    bar.style.color = isError ? '#c0392b' : 'var(--accent)';
    bar.classList.add('show');
    setTimeout(() => bar.classList.remove('show'), 4000);
  }

  async function loadProducts() {
    try {
      const res = await fetch(`${API_BASE}/products`);
      products = await res.json();
      renderProducts();
    } catch (err) {
      document.getElementById('empty-state').style.display = 'block';
      document.getElementById('empty-state').textContent =
        'Backend se connect nahi ho paya. Check karein ki server chal raha hai (npm run dev).';
    }
  }

  function renderProducts() {
    const grid = document.getElementById('products');
    const empty = document.getElementById('empty-state');
    if (!products.length) {
      empty.style.display = 'block';
      grid.innerHTML = '';
      return;
    }
    empty.style.display = 'none';
    grid.innerHTML = products.map(p => `
      <div class="card">
        <div class="card-img">${p.images && p.images[0] ? `<img src="${p.images[0]}" style="width:100%;height:100%;object-fit:cover;border-radius:6px" onerror="this.parentElement.textContent='Photo'">` : 'Photo'}</div>
        <h3>${p.name}</h3>
        <div class="price">₹${p.sellingPrice ?? '—'}</div>
        <div class="stock">${p.stock > 0 ? p.stock + ' available' : 'Out of stock'}</div>
        <button ${p.stock <= 0 ? 'disabled' : ''} onclick="addToCart('${p._id}')">
          ${p.stock <= 0 ? 'Out of Stock' : 'Cart me daalein'}
        </button>
      </div>
    `).join('');
  }

  function addToCart(productId) {
    cart[productId] = (cart[productId] || 0) + 1;
    updateCartUI();
    showStatus('Cart me daal diya');
  }

  function updateCartUI() {
    const count = Object.values(cart).reduce((a, b) => a + b, 0);
    document.getElementById('cart-count').textContent = count;

    const itemsDiv = document.getElementById('cart-items');
    let total = 0;
    itemsDiv.innerHTML = Object.entries(cart).map(([id, qty]) => {
      const product = products.find(p => p._id === id);
      if (!product) return '';
      const lineTotal = product.sellingPrice * qty;
      total += lineTotal;
      return `
        <div class="cart-item">
          <span>${product.name} × ${qty}</span>
          <span>₹${lineTotal}</span>
        </div>
      `;
    }).join('');
    document.getElementById('cart-total-amount').textContent = `₹${total}`;
  }

  function toggleCart() {
    document.getElementById('cart-panel').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
  }

  async function placeOrder() {
    const items = Object.entries(cart).map(([productId, quantity]) => ({ productId, quantity }));
    if (!items.length) {
      showStatus('Cart khali hai', true);
      return;
    }

    const token = localStorage.getItem('customerToken');
    if (!token) {
      showStatus('Pehle login karein', true);
      toggleAuth();
      return;
    }

    const paymentMethod = document.getElementById('payment-method').value;

    try {
      const res = await fetch(`${API_BASE}/orders`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({
          items,
          paymentMethod,
          deliveryAddress: { street: '', city: '', state: '', pincode: '' },
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);

      if (paymentMethod === 'cod') {
        showStatus(`Order ho gaya! Order number: ${data.order.orderNumber}`);
        cart = {};
        updateCartUI();
        toggleCart();
        loadProducts();
      } else {
        await startRazorpayPayment(data.order, token);
      }
    } catch (err) {
      showStatus(err.message, true);
    }
  }

  async function startRazorpayPayment(order, token) {
    try {
      const res = await fetch(`${API_BASE}/payments/create-razorpay-order/${order._id}`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
      });
      const paymentData = await res.json();
      if (!res.ok) throw new Error(paymentData.message);

      const options = {
        key: paymentData.key,
        amount: paymentData.amount,
        currency: paymentData.currency,
        order_id: paymentData.razorpayOrderId,
        name: 'Dukaan',
        description: `Order ${order.orderNumber}`,
        handler: async function (response) {
          const verifyRes = await fetch(`${API_BASE}/payments/verify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
            body: JSON.stringify({
              orderId: order._id,
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature,
            }),
          });
          const verifyData = await verifyRes.json();
          if (verifyRes.ok) {
            showStatus('Payment successful! Order confirm ho gaya.');
            cart = {};
            updateCartUI();
            toggleCart();
            loadProducts();
          } else {
            showStatus('Payment verify nahi hua: ' + verifyData.message, true);
          }
        },
        theme: { color: '#2f5d50' },
      };

      const rzp = new Razorpay(options);
      rzp.open();
    } catch (err) {
      showStatus('Payment start nahi ho paya: ' + err.message, true);
    }
  }

  loadProducts();
</script>

</body>
    </html>
